name: Deploy to Production / Staging

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_APP_DIR }}
            export DEPLOY_BRANCH=${{ github.ref_name }}
            if [ ! -f "deploy.sh" ]; then
              curl -sSL "https://raw.githubusercontent.com/neuravolt-technologies/neuravolt_cloud_services/${DEPLOY_BRANCH}/deploy.sh" -o deploy.sh
              chmod +x deploy.sh
            fi
            bash deploy.sh
